<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semak & Lulus OT — Mulia OT System</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .verify-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); margin-bottom:12px; overflow:hidden; transition:box-shadow 0.15s; }
    .verify-card:hover { box-shadow:var(--shadow-md); }
    .verify-header { padding:14px 18px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); }
    .verify-body { padding:14px 18px; }
    .verify-footer { padding:12px 18px; background:var(--bg); display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .info-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .info-item label { font-size:11px; color:var(--text-muted); text-transform:uppercase; font-weight:600; display:block; margin-bottom:2px; }
    .info-item span { font-size:13px; color:var(--text-primary); font-weight:600; }
    .amount-badge { background:var(--primary); color:#fff; padding:4px 12px; border-radius:20px; font-size:13px; font-weight:700; }
    .no-pending { text-align:center; padding:60px 24px; }
    .no-pending svg { width:60px; height:60px; margin:0 auto 16px; color:var(--success); }
    .reject-input { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; color:var(--text-primary); background:var(--bg); font-family:inherit; margin-top:8px; }
  </style>
</head>
<body>
<div class="app-layout" id="app-layout">
  <div class="main-content">
    <div class="page-content">

      <!-- Summary banner -->
      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap" id="verify-summary"></div>

      <!-- Filter -->
      <div class="card mb-4">
        <div class="card-body" style="padding:12px 20px">
          <div class="filter-bar">
            <div class="search-input-wrap">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" class="search-input" id="verify-search" placeholder="Cari nama pekerja, jabatan...">
            </div>
            <select class="form-control" id="verify-dept" style="width:auto;min-width:150px">
              <option value="">Semua Jabatan</option>
              <option>Construction</option><option>Engineering</option>
              <option>Admin</option><option>Operations</option><option>Finance</option>
            </select>
            <button class="btn btn-success" onclick="approveAll()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              Lulus Semua
            </button>
          </div>
        </div>
      </div>

      <div id="pending-list"></div>

    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  Auth.requireAuth();
  LAYOUT.inject('Semak & Lulus OT', 'Mulia OT System › Semak & Lulus OT');

  function getPending() {
    const q = (document.getElementById('verify-search')||{}).value?.toLowerCase() || '';
    const dept = (document.getElementById('verify-dept')||{}).value || '';
    return DB.getOTRecords().filter(r => {
      if (r.status !== 'pending') return false;
      const matchQ = !q || [r.workerName, r.department, r.reason].some(v=>v&&v.toLowerCase().includes(q));
      const matchDept = !dept || r.department === dept;
      return matchQ && matchDept;
    }).sort((a,b)=>new Date(a.submittedAt)-new Date(b.submittedAt));
  }

  function render() {
    const pending = getPending();
    const allPending = DB.getOTRecords().filter(r=>r.status==='pending');
    const totalAmt = allPending.reduce((s,r)=>s+parseFloat(r.hoursAmount||0),0);
    const totalHrs = allPending.reduce((s,r)=>s+parseFloat(r.hours||0),0);

    document.getElementById('verify-summary').innerHTML = [
      {label:'Menunggu Kelulusan', val:allPending.length, color:'var(--warning)', bg:'var(--warning-bg)'},
      {label:'Jumlah Jam', val:Math.round(totalHrs*10)/10+' jam', color:'var(--info)', bg:'var(--info-bg)'},
      {label:'Anggaran Bayaran', val:UI.formatCurrency(totalAmt), color:'var(--primary)', bg:'var(--info-bg)'},
    ].map(c=>`<div style="padding:10px 18px;background:${c.bg};border-radius:var(--radius-md);font-size:13px;font-weight:700;color:${c.color}">${c.label}: <span>${c.val}</span></div>`).join('');

    const list = document.getElementById('pending-list');
    if (pending.length === 0) {
      list.innerHTML = `<div class="no-pending"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><h3 style="color:var(--success);margin-bottom:8px">Semua OT Telah Diproses!</h3><p style="color:var(--text-muted)">Tiada permohonan OT yang menunggu kelulusan buat masa ini.</p><a href="ot_records.html" class="btn btn-outline mt-4">Lihat Semua Rekod</a></div>`;
      return;
    }

    list.innerHTML = pending.map(r => `
      <div class="verify-card">
        <div class="verify-header">
          <div class="worker-avatar" style="background:${UI.avatarColor(r.workerName)};width:40px;height:40px;font-size:14px;flex-shrink:0">${UI.initials(r.workerName)}</div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:14px;color:var(--text-primary)">${r.workerName}</div>
            <div style="font-size:12px;color:var(--text-muted)">${r.employeeId||''} · ${r.department||''}</div>
          </div>
          <span class="amount-badge">${UI.formatCurrency(r.hoursAmount||0)}</span>
          <span class="badge badge-pending">Menunggu</span>
        </div>
        <div class="verify-body">
          <div class="info-grid">
            <div class="info-item"><label>Tarikh OT</label><span>${UI.formatDate(r.otDate)}</span></div>
            <div class="info-item"><label>Jumlah Jam</label><span>${r.hours} jam</span></div>
            <div class="info-item"><label>Jenis Hari</label><span>${UI.formatDayType(r.dayType)}</span></div>
          </div>
          <div style="margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:var(--radius-sm)">
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:3px;font-weight:600;text-transform:uppercase">Sebab OT</div>
            <div style="font-size:13px;color:var(--text-secondary)">${r.reason||'—'}</div>
          </div>
          <div id="reject-area-${r.id}" style="display:none;margin-top:8px">
            <input class="reject-input" id="reject-remarks-${r.id}" placeholder="Nyatakan sebab penolakan (pilihan)...">
          </div>
        </div>
        <div class="verify-footer">
          <div style="font-size:12px;color:var(--text-muted)">Dihantar: ${UI.formatDateTime(r.submittedAt)}</div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-outline btn-sm" onclick="toggleReject('${r.id}')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              Tolak
            </button>
            <button class="btn btn-danger btn-sm" id="confirm-reject-${r.id}" style="display:none" onclick="doReject('${r.id}')">Sahkan Tolak</button>
            <button class="btn btn-success btn-sm" onclick="doApprove('${r.id}')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
              Luluskan
            </button>
          </div>
        </div>
      </div>`).join('');
  }

  function toggleReject(id) {
    const area = document.getElementById('reject-area-'+id);
    const confirmBtn = document.getElementById('confirm-reject-'+id);
    if (area.style.display === 'none') { area.style.display='block'; confirmBtn.style.display='inline-flex'; }
    else { area.style.display='none'; confirmBtn.style.display='none'; }
  }

  function doApprove(id) {
    DB.updateOTStatus(id, 'approved');
    UI.toast('OT berjaya diluluskan.', 'success');
    render();
  }

  function doReject(id) {
    const remarks = document.getElementById('reject-remarks-'+id)?.value || '';
    DB.updateOTStatus(id, 'rejected', remarks);
    UI.toast('OT berjaya ditolak.', 'info');
    render();
  }

  function approveAll() {
    const pending = getPending();
    if (pending.length === 0) { UI.toast('Tiada OT menunggu kelulusan.', 'info'); return; }
    const overlay = document.getElementById('confirm-modal');
    const msg = document.getElementById('confirm-message');
    if (msg) msg.textContent = 'Adakah anda pasti untuk meluluskan semua ' + pending.length + ' permohonan OT yang menunggu?';
    const ok = document.getElementById('confirm-ok');
    const newOk = ok.cloneNode(true);
    ok.parentNode.replaceChild(newOk, ok);
    newOk.addEventListener('click', () => {
      pending.forEach(r => DB.updateOTStatus(r.id, 'approved'));
      UI.closeModal('confirm-modal');
      UI.toast(pending.length + ' permohonan OT berjaya diluluskan.', 'success');
      render();
    });
    document.getElementById('confirm-cancel').onclick = () => UI.closeModal('confirm-modal');
    overlay.classList.add('open'); document.body.style.overflow='hidden';
  }

  ['verify-search','verify-dept'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', render);
    document.getElementById(id)?.addEventListener('change', render);
  });

  render();
</script>
</body>
</html>
