<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senarai Pekerja — Mulia OT System</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-layout" id="app-layout">
  <div class="main-content">
    <div class="page-content">

      <!-- Filter Bar -->
      <div class="card mb-4">
        <div class="card-body" style="padding:14px 20px">
          <div class="filter-bar">
            <div class="search-input-wrap">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" class="search-input" id="worker-search" placeholder="Cari nama, ID pekerja, jabatan...">
            </div>
            <select class="form-control" id="dept-filter" style="width:auto;min-width:150px">
              <option value="">Semua Jabatan</option>
              <option>Construction</option><option>Engineering</option>
              <option>Admin</option><option>Operations</option><option>Finance</option>
            </select>
            <select class="form-control" id="status-filter" style="width:auto;min-width:130px">
              <option value="">Semua Status</option>
              <option value="active">Aktif</option>
              <option value="inactive">Tidak Aktif</option>
            </select>
            <button class="btn btn-primary" onclick="UI.openModal('modal-add-worker')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Tambah Pekerja
            </button>
            <button class="btn btn-outline" onclick="exportWorkers()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Export CSV
            </button>
          </div>
        </div>
      </div>

      <!-- Stats Row -->
      <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px" id="worker-stats"></div>

      <!-- Table -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">Senarai Pekerja</div>
          <span class="text-sm text-muted" id="worker-count">0 pekerja</span>
        </div>
        <div class="table-wrapper" id="print-area">
          <table>
            <thead>
              <tr>
                <th>Pekerja</th>
                <th>No. Pekerja</th>
                <th>Jabatan</th>
                <th>Jawatan</th>
                <th>Telefon</th>
                <th>Gaji Asas</th>
                <th>Status</th>
                <th style="text-align:right">Tindakan</th>
              </tr>
            </thead>
            <tbody id="workers-tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>

    </div>
  </div>
</div>

<!-- Add/Edit Worker Modal -->
<div class="modal-overlay" id="modal-add-worker">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <div class="modal-title" id="modal-worker-title">Tambah Pekerja Baru</div>
      <button class="btn-icon btn-sm" onclick="UI.closeModal('modal-add-worker')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-worker-id">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Nama Penuh <span class="required">*</span></label>
          <input type="text" id="w-name" class="form-control" placeholder="Contoh: Ahmad bin Ali" required>
        </div>
        <div class="form-group">
          <label class="form-label">No. Pekerja <span class="required">*</span></label>
          <input type="text" id="w-emp-id" class="form-control" placeholder="Contoh: EMP1001">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">No. Kad Pengenalan</label>
          <input type="text" id="w-ic" class="form-control" placeholder="XXXXXX-XX-XXXX">
        </div>
        <div class="form-group">
          <label class="form-label">No. Telefon</label>
          <input type="text" id="w-phone" class="form-control" placeholder="01X-XXXXXXXX">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Jabatan <span class="required">*</span></label>
          <select id="w-dept" class="form-control">
            <option value="">-- Pilih --</option>
            <option>Construction</option><option>Engineering</option>
            <option>Admin</option><option>Operations</option><option>Finance</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Jawatan <span class="required">*</span></label>
          <input type="text" id="w-position" class="form-control" placeholder="Contoh: Site Engineer">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Emel</label>
          <input type="email" id="w-email" class="form-control" placeholder="nama@mulia.com.my">
        </div>
        <div class="form-group">
          <label class="form-label">Gaji Asas (RM) <span class="required">*</span></label>
          <input type="number" id="w-salary" class="form-control" placeholder="0.00" min="0" step="50">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Tarikh Mula Bekerja</label>
          <input type="date" id="w-join-date" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="w-status" class="form-control">
            <option value="active">Aktif</option>
            <option value="inactive">Tidak Aktif</option>
          </select>
        </div>
      </div>
      <div class="form-group mb-0">
        <label class="form-label">Catatan</label>
        <textarea id="w-notes" class="form-control" placeholder="Nota tambahan..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="UI.closeModal('modal-add-worker')">Batal</button>
      <button class="btn btn-primary" onclick="saveWorker()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Simpan
      </button>
    </div>
  </div>
</div>

<!-- View Worker Modal -->
<div class="modal-overlay" id="modal-view-worker">
  <div class="modal" style="max-width:500px">
    <div class="modal-header">
      <div class="modal-title">Maklumat Pekerja</div>
      <button class="btn-icon btn-sm" onclick="UI.closeModal('modal-view-worker')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="worker-detail-body"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="UI.closeModal('modal-view-worker')">Tutup</button>
      <button class="btn btn-primary" id="view-edit-btn">Edit Pekerja</button>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  Auth.requireAuth();
  LAYOUT.inject('Pekerja', 'Mulia OT System › Pekerja');

  let allWorkers = [];
  let currentPage = 1;
  const PAGE_SIZE = 10;

  function loadWorkers() {
    allWorkers = DB.getWorkers();
    renderStats();
    renderTable();
  }

  function renderStats() {
    const active = allWorkers.filter(w => w.status === 'active').length;
    const inactive = allWorkers.filter(w => w.status === 'inactive').length;
    const depts = [...new Set(allWorkers.map(w => w.department).filter(Boolean))].length;
    const thisMonth = new Date().toISOString().substring(0,7);
    const newThisMonth = allWorkers.filter(w => w.joinDate && w.joinDate.startsWith(thisMonth)).length;
    document.getElementById('worker-stats').innerHTML = [
      {label:'Jumlah Pekerja', val:allWorkers.length, cls:'blue'},
      {label:'Pekerja Aktif', val:active, cls:'green'},
      {label:'Tidak Aktif', val:inactive, cls:'red'},
      {label:'Bilangan Jabatan', val:depts, cls:'gold'}
    ].map(s => `
      <div class="stat-card" style="padding:14px 16px">
        <div class="stat-info">
          <div class="stat-value">${s.val}</div>
          <div class="stat-label">${s.label}</div>
        </div>
      </div>`).join('');
  }

  function getFiltered() {
    const q = document.getElementById('worker-search').value.toLowerCase();
    const dept = document.getElementById('dept-filter').value;
    const status = document.getElementById('status-filter').value;
    return allWorkers.filter(w => {
      const matchQ = !q || [w.name, w.employeeId, w.department, w.position, w.phone].some(v => v && String(v).toLowerCase().includes(q));
      const matchDept = !dept || w.department === dept;
      const matchStatus = !status || w.status === status;
      return matchQ && matchDept && matchStatus;
    });
  }

  function renderTable() {
    const filtered = getFiltered();
    const total = filtered.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    currentPage = Math.min(currentPage, totalPages);
    const page = filtered.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

    document.getElementById('worker-count').textContent = total + ' pekerja';

    const tbody = document.getElementById('workers-tbody');
    if (page.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><h4>Tiada Pekerja</h4><p>Tiada rekod yang sepadan.</p></div></td></tr>';
    } else {
      tbody.innerHTML = page.map(w => `
        <tr>
          <td>
            <div class="worker-cell">
              <div class="worker-avatar" style="background:${UI.avatarColor(w.name)}">${UI.initials(w.name)}</div>
              <div>
                <div class="worker-name">${w.name}</div>
                <div class="worker-id">${w.id}</div>
              </div>
            </div>
          </td>
          <td>${w.employeeId || '—'}</td>
          <td>${w.department || '—'}</td>
          <td style="color:var(--text-secondary)">${w.position || '—'}</td>
          <td style="color:var(--text-secondary)">${w.phone || '—'}</td>
          <td style="font-weight:600">${UI.formatCurrency(w.basicSalary || 0)}</td>
          <td>${UI.statusBadge(w.status || 'active')}</td>
          <td>
            <div style="display:flex;justify-content:flex-end;gap:6px">
              <button class="btn btn-outline btn-xs" onclick="viewWorker('${w.id}')">Lihat</button>
              <button class="btn btn-outline btn-xs" onclick="editWorker('${w.id}')">Edit</button>
              <button class="btn btn-danger btn-xs" onclick="deleteWorker('${w.id}','${w.name}')">Padam</button>
            </div>
          </td>
        </tr>`).join('');
    }

    // Pagination
    const pag = document.getElementById('pagination');
    if (totalPages <= 1) { pag.innerHTML = ''; return; }
    let html = `<span class="page-info">${total} rekod</span>`;
    html += `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage<=1?'disabled':''}>‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i===1||i===totalPages||Math.abs(i-currentPage)<=1) html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      else if (Math.abs(i-currentPage)===2) html += '<span style="padding:0 4px;color:var(--text-muted)">…</span>';
    }
    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages?'disabled':''}>›</button>`;
    pag.innerHTML = html;
  }

  function goPage(p) { currentPage = p; renderTable(); }

  ['worker-search','dept-filter','status-filter'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', () => { currentPage=1; renderTable(); });
    document.getElementById(id)?.addEventListener('change', () => { currentPage=1; renderTable(); });
  });

  function viewWorker(id) {
    const w = DB.getWorkerById(id);
    if (!w) return;
    document.getElementById('worker-detail-body').innerHTML = `
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)">
        <div class="worker-avatar" style="width:56px;height:56px;font-size:20px;border-radius:12px;background:${UI.avatarColor(w.name)}">${UI.initials(w.name)}</div>
        <div>
          <div style="font-size:17px;font-weight:700;color:var(--text-primary)">${w.name}</div>
          <div style="font-size:12px;color:var(--text-muted)">${w.position||''} · ${w.department||''}</div>
          <div style="margin-top:6px">${UI.statusBadge(w.status||'active')}</div>
        </div>
      </div>
      <div class="form-row" style="gap:12px">
        ${[['No. Pekerja', w.employeeId],['No. IC', w.ic],['Telefon', w.phone],['Emel', w.email],
           ['Gaji Asas', UI.formatCurrency(w.basicSalary||0)],['Tarikh Mula', UI.formatDate(w.joinDate)]
        ].map(([l,v]) => `<div><div style="font-size:11px;color:var(--text-muted);margin-bottom:2px;text-transform:uppercase;font-weight:600">${l}</div><div style="font-size:13px;color:var(--text-primary);font-weight:500">${v||'—'}</div></div>`).join('')}
      </div>
      ${w.notes ? `<div class="mt-3"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;font-weight:600">Catatan</div><div style="font-size:13px;color:var(--text-secondary)">${w.notes}</div></div>` : ''}`;
    document.getElementById('view-edit-btn').onclick = () => { UI.closeModal('modal-view-worker'); editWorker(id); };
    UI.openModal('modal-view-worker');
  }

  function editWorker(id) {
    const w = DB.getWorkerById(id);
    if (!w) return;
    clearForm();
    document.getElementById('modal-worker-title').textContent = 'Edit Pekerja';
    document.getElementById('edit-worker-id').value = id;
    document.getElementById('w-name').value = w.name || '';
    document.getElementById('w-emp-id').value = w.employeeId || '';
    document.getElementById('w-ic').value = w.ic || '';
    document.getElementById('w-phone').value = w.phone || '';
    document.getElementById('w-dept').value = w.department || '';
    document.getElementById('w-position').value = w.position || '';
    document.getElementById('w-email').value = w.email || '';
    document.getElementById('w-salary').value = w.basicSalary || '';
    document.getElementById('w-join-date').value = w.joinDate || '';
    document.getElementById('w-status').value = w.status || 'active';
    document.getElementById('w-notes').value = w.notes || '';
    UI.openModal('modal-add-worker');
  }

  function clearForm() {
    ['w-name','w-emp-id','w-ic','w-phone','w-dept','w-position','w-email','w-salary','w-join-date','w-notes'].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = '';
    });
    document.getElementById('edit-worker-id').value = '';
    document.getElementById('w-status').value = 'active';
    document.getElementById('modal-worker-title').textContent = 'Tambah Pekerja Baru';
  }

  function saveWorker() {
    const name = document.getElementById('w-name').value.trim();
    const dept = document.getElementById('w-dept').value;
    const pos = document.getElementById('w-position').value.trim();
    const salary = parseFloat(document.getElementById('w-salary').value);
    if (!name || !dept || !pos || !salary) { UI.toast('Sila lengkapkan semua medan wajib.','error'); return; }

    const data = {
      name, employeeId: document.getElementById('w-emp-id').value.trim(),
      ic: document.getElementById('w-ic').value.trim(),
      phone: document.getElementById('w-phone').value.trim(),
      department: dept, position: pos,
      email: document.getElementById('w-email').value.trim(),
      basicSalary: salary,
      joinDate: document.getElementById('w-join-date').value,
      status: document.getElementById('w-status').value,
      notes: document.getElementById('w-notes').value.trim()
    };

    const editId = document.getElementById('edit-worker-id').value;
    if (editId) {
      DB.updateWorker(editId, data);
      UI.toast('Maklumat pekerja berjaya dikemas kini.', 'success');
    } else {
      DB.addWorker(data);
      UI.toast('Pekerja baru berjaya ditambah.', 'success');
    }
    UI.closeModal('modal-add-worker');
    loadWorkers();
  }

  function deleteWorker(id, name) {
    const overlay = document.getElementById('confirm-modal');
    const msg = document.getElementById('confirm-message');
    if (msg) msg.textContent = 'Adakah anda pasti untuk memadam pekerja "' + name + '"? Tindakan ini tidak boleh dibatalkan.';
    const ok = document.getElementById('confirm-ok');
    const newOk = ok.cloneNode(true);
    ok.parentNode.replaceChild(newOk, ok);
    newOk.addEventListener('click', () => {
      DB.deleteWorker(id);
      UI.closeModal('confirm-modal');
      UI.toast('Pekerja berjaya dipadam.', 'success');
      loadWorkers();
    });
    document.getElementById('confirm-cancel').onclick = () => UI.closeModal('confirm-modal');
    overlay.classList.add('open');
  }

  function exportWorkers() {
    const headers = ['ID','Nama','No Pekerja','No IC','Jabatan','Jawatan','Telefon','Emel','Gaji Asas','Tarikh Masuk','Status'];
    const rows = allWorkers.map(w => [w.id,w.name,w.employeeId,w.ic,w.department,w.position,w.phone,w.email,w.basicSalary,w.joinDate,w.status]);
    ExportHelper.toCSV(headers, rows, 'Mulia_Pekerja_' + new Date().toISOString().split('T')[0] + '.csv');
    UI.toast('Fail CSV berjaya dieksport.', 'success');
  }

  document.querySelector('[onclick*="add-worker"]')?.addEventListener('click', clearForm);
  loadWorkers();

  // Open add modal if URL has ?action=add
  if (new URLSearchParams(window.location.search).get('action') === 'add') {
    setTimeout(() => UI.openModal('modal-add-worker'), 400);
  }
</script>
</body>
</html>
