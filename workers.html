<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Profiles | Mulia OT V4</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
body{margin:0;background:#f3f6fa;color:#192b43;font:13px Inter,Arial}*{box-sizing:border-box}.bar{background:#10243e;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.bar a{color:#bfe8c6;text-decoration:none}.wrap{max-width:1250px;margin:25px auto;padding:0 18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.head h1{margin:0 0 7px;font-size:24px}.muted{color:#718096;font-size:11px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:13px;margin-bottom:17px;overflow:hidden}.panelhead{padding:16px 18px;border-bottom:1px solid #e2e8f0;font-weight:700}.body{padding:17px}.row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.row input,.row select,.grid input{padding:11px;border:1px solid #dbe3ec;border-radius:8px;font:12px Inter;min-width:0}.row input{flex:1;min-width:170px}button{padding:10px 13px;border:0;border-radius:8px;background:#193e60;color:white;font:600 11px Inter;cursor:pointer}.secondary{background:#eaf0f6;color:#193e60}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:9px;color:#7d8b9c;text-transform:uppercase;background:#f8fafc;padding:12px}td{font-size:11px;padding:12px;border-top:1px solid #edf1f5}.table{overflow:auto}.notice{display:none;padding:12px;border-radius:8px;margin-bottom:12px}.notice.show{display:block;background:#e6f7ec;color:#17633a}.notice.error{background:#fff0f0;color:#a52f3d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid label{font-size:10px;font-weight:700;display:block;margin-bottom:6px}.grid input{width:100%}.full{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.tag{font-size:9px;padding:5px 8px;border-radius:20px;background:#e2f6e8;color:#207348}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.bar{padding:15px}.wrap{margin:18px auto;padding:0 12px}.head h1{font-size:21px}}

:root{--navy:#10243e;--navy2:#1c4264;--mint:#9be6a6;--page:#f3f6fa;--line:#e4eaf1}body{background:var(--page);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bar{position:sticky;top:0;z-index:10;background:linear-gradient(115deg,#10243e,#1c4264);padding:14px clamp(14px,3vw,32px);box-shadow:0 8px 25px #10243e1c;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;min-width:0}.brand img{width:112px;height:34px;object-fit:contain}.brand span{display:flex;flex-direction:column;gap:4px}.brand strong{font-size:12px;letter-spacing:.5px}.brand small{font-size:10px;color:#b9c9d9}.topnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.topnav a{color:#e3edf7;text-decoration:none;font-size:11px;font-weight:600;padding:10px 12px;border-radius:10px;transition:background .18s,transform .18s}.topnav a:hover{background:#ffffff18;transform:translateY(-1px)}.wrap{max-width:1450px;margin:26px auto;padding:0 clamp(12px,2vw,24px)}.panel{border-radius:17px;box-shadow:0 8px 26px #10243e08;border-color:#e5ebf2}.panelhead{font-size:13px}.head h1{letter-spacing:-.7px}.row input:focus,.row select:focus,.grid input:focus{outline:none;border-color:#6686a6;box-shadow:0 0 0 3px #1c426414}button{transition:transform .18s,box-shadow .18s,background .18s}button:hover{transform:translateY(-1px);box-shadow:0 5px 14px #10243e16}button:disabled{opacity:.6;cursor:wait;transform:none}.table{border-radius:10px}table{min-width:720px}th{letter-spacing:.5px}td{vertical-align:middle}@media(max-width:700px){.bar{align-items:flex-start;gap:12px}.brand img{width:88px;height:30px}.topnav{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.topnav a{white-space:nowrap;padding:9px 11px}.wrap{margin:17px auto}.head{align-items:flex-start}.panelhead{padding:14px}.body{padding:13px}.row{width:100%}.row input{min-width:100%;flex-basis:100%}.row select{flex:1;min-width:0}}
</style><link rel="icon" href="https://mulialand.com/themes/mulia//assets/img/logo_white.svg" type="image/svg+xml"></head><body><header class="bar"><a class="brand" href="https://mulialand.com/" target="_blank" rel="noopener noreferrer" aria-label="Mulia Group home"><img src="https://mulialand.com/themes/mulia//assets/img/logo_white.svg" alt="Mulia Group"><span><strong>MULIA OT SYSTEM</strong><small>Worker profiles · Workforce operations</small></span></a><nav class="topnav"><a href="dashboard.html">Dashboard</a><a href="workers.html">Workers</a><a href="ot-records.html">OT records</a><a href="reports.html">Reports</a></nav></header><main class="wrap"><div class="head"><div><h1>Worker profiles</h1><div class="muted">Create and maintain worker details used in OT submissions.</div></div><button id="signout" class="secondary">Sign out</button></div><div id="notice" class="notice"></div><section class="panel"><div class="panelhead">Add worker profile</div><div class="body"><form id="workerForm"><div class="grid"><div><label>Full name *</label><input id="name" required maxlength="160"></div><div><label>Employee ID *</label><input id="employee" required maxlength="60"></div><div><label>Passport / IC *</label><input id="passport" required maxlength="80"></div><div><label>Phone</label><input id="phone" maxlength="40"></div><div><label>Company *</label><input id="company" required maxlength="160"></div><div><label>Trade *</label><input id="trade" required maxlength="120" placeholder="e.g. Technician, Electrician"></div><div class="full"><label>Email (optional)</label><input id="email" type="email" maxlength="254"></div></div><div class="formactions"><button type="reset" class="secondary">Clear</button><button id="save" type="submit">Save worker profile</button></div></form></div></section><section class="panel"><div class="panelhead">Worker directory</div><div class="body"><div class="row"><input id="search" placeholder="Search name, employee ID, company or trade"><select id="status"><option value="">All statuses</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div><div class="table"><table><thead><tr><th>Name / ID</th><th>IC / Passport</th><th>Company</th><th>Trade</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody></table></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-client.js"></script><script>
(async()=>{const S=window.MuliaSupabase,$=id=>document.getElementById(id);let all=[];function msg(t,err=false){$('notice').textContent=t;$('notice').className='notice show'+(err?' error':'')}const esc=S.escapeHTML;if(!S.configured||!S.client){location.href='setup.html';return}if(!await S.requireSession())return;try{await S.getProfile();await load()}catch(e){msg(e.message,true)}async function load(){const {data,error}=await S.client.from('workers').select('*').order('full_name');if(error)throw error;all=data||[];render()}function render(){const q=$('search').value.toLowerCase(),st=$('status').value;const a=all.filter(w=>(!st||w.status===st)&&[w.full_name,w.employee_id,w.company,w.trade,w.phone].some(x=>String(x||'').toLowerCase().includes(q)));$('rows').innerHTML=a.length?a.map(w=>'<tr><td><b>'+esc(w.full_name)+'</b><div class="muted">'+esc(w.employee_id)+'</div></td><td>'+esc(w.passport_ic)+'</td><td>'+esc(w.company)+'</td><td>'+esc(w.trade)+'</td><td>'+esc(w.phone||'—')+'</td><td><span class="tag" style="'+(w.status==='inactive'?'background:#f1f5f9;color:#68788d':'')+'">'+esc(w.status)+'</span></td><td><button class="secondary" data-toggle="'+esc(w.id)+'" data-status="'+esc(w.status)+'">'+(w.status==='active'?'Deactivate':'Activate')+'</button></td></tr>').join(''):'<tr><td colspan="7">No worker profiles found.</td></tr>'}$('search').oninput=render;$('status').onchange=render;$('workerForm').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{const {data:au}=await S.client.auth.getUser();const payload={full_name:$('name').value.trim(),employee_id:$('employee').value.trim(),passport_ic:$('passport').value.trim(),phone:$('phone').value.trim()||null,company:$('company').value.trim(),trade:$('trade').value.trim(),email:$('email').value.trim()||null,created_by:au.user.id};const {data,error}=await S.client.from('workers').insert(payload).select('id').single();if(error)throw error;await S.writeAudit('create','worker',data.id,{employee_id:payload.employee_id});$('workerForm').reset();await load();msg('Worker profile saved successfully.')}catch(e){msg(e.message,true)}finally{$('save').disabled=false}};$('rows').onclick=async e=>{const b=e.target.closest('[data-toggle]');if(!b)return;try{const status=b.dataset.status==='active'?'inactive':'active';const {error}=await S.client.from('workers').update({status,updated_at:new Date().toISOString()}).eq('id',b.dataset.toggle);if(error)throw error;await S.writeAudit('update','worker',b.dataset.toggle,{status});await load();msg('Worker status updated.')}catch(e){msg(e.message,true)}};$('signout').onclick=()=>S.signOut()})();
</script></body></html>
