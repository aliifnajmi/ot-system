<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OT Records | Mulia OT V4</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#f3f6fa;color:#192b43;font:13px Inter,Arial}*{box-sizing:border-box}.bar{background:#10243e;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.bar a{color:#bfe8c6;text-decoration:none}.wrap{max-width:1250px;margin:25px auto;padding:0 18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.head h1{margin:0 0 7px;font-size:24px}.muted{color:#718096;font-size:11px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:13px;margin-bottom:17px;overflow:hidden}.panelhead{padding:16px 18px;border-bottom:1px solid #e2e8f0;font-weight:700}.body{padding:17px}.row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.row input,.row select,.grid input,.grid select,.grid textarea{padding:11px;border:1px solid #dbe3ec;border-radius:8px;font:12px Inter;min-width:0}.row input{flex:1;min-width:170px}button{padding:10px 13px;border:0;border-radius:8px;background:#193e60;color:white;font:600 11px Inter;cursor:pointer}.secondary{background:#eaf0f6;color:#193e60}.danger{background:#fff0f0;color:#b32d3b}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:9px;color:#7d8b9c;text-transform:uppercase;background:#f8fafc;padding:12px}td{font-size:11px;padding:12px;border-top:1px solid #edf1f5}.table{overflow:auto}.notice{display:none;padding:12px;border-radius:8px;margin-bottom:12px}.notice.show{display:block;background:#e6f7ec;color:#17633a}.notice.error{background:#fff0f0;color:#a52f3d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid label{font-size:10px;font-weight:700;display:block;margin-bottom:6px}.grid input,.grid select,.grid textarea{width:100%}.full{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.tag{font-size:9px;padding:5px 8px;border-radius:20px;background:#e2f6e8;color:#207348}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.bar{padding:15px}.wrap{margin:18px auto;padding:0 12px}.head h1{font-size:21px}}</style></head><body><header class="bar"><b>MULIA OT SYSTEM · OT RECORDS</b><div><a href="dashboard.html">Dashboard</a>　<a href="workers.html">Workers</a>　<a href="reports.html">Reports</a></div></header><main class="wrap"><div class="head"><div><h1>Overtime records</h1><div class="muted">Search, filter and review OT submissions.</div></div><button id="signout" class="secondary">Sign out</button></div><div id="notice" class="notice"></div><section class="panel"><div class="body"><div class="row"><input id="search" placeholder="Search worker, employee ID or location"><select id="status"><option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><input id="from" type="date" aria-label="From date"><input id="to" type="date" aria-label="To date"></div><div class="table"><table><thead><tr><th>Worker</th><th>Employee ID</th><th>OT date</th><th>Time</th><th>Hours</th><th>Location / reason</th><th>Status</th><th>Review</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading…</td></tr></tbody></table></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-client.js"></script><script>
(async()=>{const S=window.MuliaSupabase,$=id=>document.getElementById(id),esc=S.escapeHTML;let all=[],profile;if(!S.configured||!S.client){location.href='setup.html';return}if(!await S.requireSession())return;try{profile=await S.getProfile();await load()}catch(e){msg(e.message,true)}function msg(t,err=false){$('notice').textContent=t;$('notice').className='notice show'+(err?' error':'')}async function load(){const {data,error}=await S.client.from('ot_records').select('*,workers(full_name,employee_id)').order('ot_date',{ascending:false}).limit(1000);if(error)throw error;all=data||[];render()}function render(){const q=$('search').value.toLowerCase(),st=$('status').value,f=$('from').value,t=$('to').value;const list=all.filter(r=>(!st||r.status===st)&&(!f||r.ot_date>=f)&&(!t||r.ot_date<=t)&&[r.workers?.full_name,r.workers?.employee_id,r.location,r.remarks].some(v=>String(v||'').toLowerCase().includes(q)));$('rows').innerHTML=list.length?list.map(r=>'<tr><td><b>'+esc(r.workers?.full_name||'—')+'</b></td><td>'+esc(r.workers?.employee_id||'—')+'</td><td>'+esc(r.ot_date)+'</td><td>'+esc(String(r.start_time).slice(0,5))+'–'+esc(String(r.end_time).slice(0,5))+'</td><td>'+Number(r.hours).toFixed(2)+'</td><td>'+esc(r.location)+'<div class="muted">'+esc(r.remarks)+'</div></td><td><span class="tag" style="'+(r.status==='rejected'?'background:#ffe7e8;color:#b32d3b':r.status==='pending'?'background:#fff4db;color:#99650b':'')+'">'+esc(r.status)+'</span></td><td>'+(r.status==='pending'?'<button data-review="approved" data-id="'+esc(r.id)+'">Approve</button> <button class="danger" data-review="rejected" data-id="'+esc(r.id)+'">Reject</button>':'<span class="muted">Reviewed</span>')+'</td></tr>').join(''):'<tr><td colspan="8">No matching records.</td></tr>'}['search','status','from','to'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('rows').onclick=async e=>{const b=e.target.closest('[data-review]');if(!b)return;const remarks=b.dataset.review==='rejected'?prompt('Reason for rejection (required):'):null;if(b.dataset.review==='rejected'&&!remarks?.trim())return msg('Rejection reason is required.',true);try{const {data:au}=await S.client.auth.getUser();const {error}=await S.client.from('ot_records').update({status:b.dataset.review,reviewed_by:au.user.id,reviewed_at:new Date().toISOString(),review_remarks:remarks||null,updated_at:new Date().toISOString()}).eq('id',b.dataset.id).eq('status','pending');if(error)throw error;await S.writeAudit('review','ot_record',b.dataset.id,{status:b.dataset.review,remarks});await load();msg('OT status updated to '+b.dataset.review+'.')}catch(e){msg(e.message,true)}};$('signout').onclick=()=>S.signOut()})();
</script></body></html>
