<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports | Mulia OT V4</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#f3f6fa;color:#192b43;font:13px Inter,Arial}*{box-sizing:border-box}.bar{background:#10243e;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.bar a{color:#bfe8c6;text-decoration:none}.wrap{max-width:1250px;margin:25px auto;padding:0 18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.head h1{margin:0 0 7px;font-size:24px}.muted{color:#718096;font-size:11px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:13px;margin-bottom:17px;overflow:hidden}.panelhead{padding:16px 18px;border-bottom:1px solid #e2e8f0;font-weight:700}.body{padding:17px}.row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.row input,.row select,.grid input,.grid select,.grid textarea{padding:11px;border:1px solid #dbe3ec;border-radius:8px;font:12px Inter;min-width:0}.row input{flex:1;min-width:170px}button{padding:10px 13px;border:0;border-radius:8px;background:#193e60;color:white;font:600 11px Inter;cursor:pointer}.secondary{background:#eaf0f6;color:#193e60}.danger{background:#fff0f0;color:#b32d3b}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:9px;color:#7d8b9c;text-transform:uppercase;background:#f8fafc;padding:12px}td{font-size:11px;padding:12px;border-top:1px solid #edf1f5}.table{overflow:auto}.notice{display:none;padding:12px;border-radius:8px;margin-bottom:12px}.notice.show{display:block;background:#e6f7ec;color:#17633a}.notice.error{background:#fff0f0;color:#a52f3d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid label{font-size:10px;font-weight:700;display:block;margin-bottom:6px}.grid input,.grid select,.grid textarea{width:100%}.full{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.tag{font-size:9px;padding:5px 8px;border-radius:20px;background:#e2f6e8;color:#207348}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.bar{padding:15px}.wrap{margin:18px auto;padding:0 12px}.head h1{font-size:21px}}</style></head><body><header class="bar"><b>MULIA OT SYSTEM · REPORT CENTRE</b><div><a href="dashboard.html">Dashboard</a>　<a href="workers.html">Workers</a>　<a href="ot-records.html">OT records</a></div></header><main class="wrap"><div class="head"><div><h1>Report centre</h1><div class="muted">Filter OT records and export the current results as CSV, compatible with Excel.</div></div><button id="signout" class="secondary">Sign out</button></div><div id="notice" class="notice"></div><section class="panel"><div class="body"><div class="row"><label>From <input id="from" type="date"></label><label>To <input id="to" type="date"></label><select id="status"><option value="">All statuses</option><option>pending</option><option>approved</option><option>rejected</option></select><button id="apply">Apply filters</button><button id="csv" class="secondary">Download CSV / Excel</button><button id="print" class="secondary">Print / Save PDF</button></div><div id="summary" class="muted">Loading report data…</div><div class="table"><table><thead><tr><th>Date</th><th>Employee ID</th><th>Worker</th><th>Company</th><th>Trade</th><th>Start</th><th>End</th><th>Hours</th><th>Location</th><th>Status</th><th>Remarks</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-client.js"></script><script>
(async()=>{const S=window.MuliaSupabase,$=id=>document.getElementById(id),esc=S.escapeHTML;let all=[],filtered=[];if(!S.configured||!S.client){location.href='setup.html';return}if(!await S.requireSession())return;try{await S.getProfile();const {data,error}=await S.client.from('ot_records').select('*,workers(full_name,employee_id,company,trade)').order('ot_date',{ascending:false}).limit(5000);if(error)throw error;all=data||[];render()}catch(e){$('notice').textContent=e.message;$('notice').className='notice show error'}function render(){filtered=all.filter(r=>(!$('from').value||r.ot_date>=$('from').value)&&(!$('to').value||r.ot_date<=$('to').value)&&(!$('status').value||r.status===$('status').value));$('rows').innerHTML=filtered.map(r=>'<tr><td>'+esc(r.ot_date)+'</td><td>'+esc(r.workers?.employee_id||'')+'</td><td>'+esc(r.workers?.full_name||'')+'</td><td>'+esc(r.workers?.company||'')+'</td><td>'+esc(r.workers?.trade||'')+'</td><td>'+esc(String(r.start_time).slice(0,5))+'</td><td>'+esc(String(r.end_time).slice(0,5))+'</td><td>'+Number(r.hours).toFixed(2)+'</td><td>'+esc(r.location)+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.remarks)+'</td></tr>').join('');const hours=filtered.reduce((s,r)=>s+Number(r.hours||0),0);$('summary').textContent=filtered.length+' records · '+hours.toFixed(2)+' total hours · '+filtered.filter(r=>r.status==='approved').reduce((s,r)=>s+Number(r.hours||0),0).toFixed(2)+' approved hours'}$('apply').onclick=render;$('csv').onclick=()=>{const cols=['OT Date','Employee ID','Full Name','Company','Trade','Start Time','End Time','Hours','Location','Status','Remarks'];const val=r=>[r.ot_date,r.workers?.employee_id,r.workers?.full_name,r.workers?.company,r.workers?.trade,r.start_time,r.end_time,r.hours,r.location,r.status,r.remarks].map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',');const blob=new Blob(['\ufeff'+cols.map(x=>'"'+x+'"').join(',')+'\r\n'+filtered.map(val).join('\r\n')],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Mulia-OT-Report.csv';a.click();URL.revokeObjectURL(a.href)};$('print').onclick=()=>window.print();$('signout').onclick=()=>S.signOut()})();
</script></body></html>
